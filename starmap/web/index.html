<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nJTIzMDYwYTEyJy8+PGNpcmNsZSBjeD0nMTYnIGN5PScxNicgcj0nOScgZmlsbD0nbm9uZScgc3Ryb2tlPSclMjNlOGMzN2EnIHN0cm9rZS13aWR0aD0nMScvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzMuNCcgZmlsbD0nJTIzZThjMzdhJy8+PGNpcmNsZSBjeD0nMjQnIGN5PSc4JyByPScxLjQnIGZpbGw9JyUyMzZmZDZkMCcvPjxjaXJjbGUgY3g9JzcnIGN5PScyMycgcj0nMS4xJyBmaWxsPSclMjNiNzljZWQnLz48L3N2Zz4=">
<title>驾鹤集 · 群星纪年</title>
<style>
:root{
  --bg:#060a12; --bg2:#0b1220; --panel:rgba(12,20,34,.92); --line:#1d2c42;
  --ink:#e8eef7; --ink2:#9fb0c8; --ink3:#64748c;
  --gold:#e8c37a; --cyan:#6fd6d0; --violet:#b79ced; --rose:#f0a0b4;
  --orange:#f0ae72; --blue:#7fb2f0; --green:#96d49a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
a{color:var(--cyan)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* ---------- 顶栏 ---------- */
header{display:flex;align-items:center;gap:18px;padding:11px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a1220,#070c16);flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:11px;white-space:nowrap}
.brand h1{font-family:"Songti SC","STSong",serif;font-size:21px;letter-spacing:.16em;margin:0;color:var(--gold);font-weight:600}
.brand small{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.ctrls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0b1422;flex:0 0 auto}
.seg button{background:transparent;border:0;color:var(--ink2);padding:5px 12px;font-size:12px;cursor:pointer}
.seg button.on{background:#1c304c;color:var(--gold)}
.btn{background:#122036;border:1px solid var(--line);color:var(--ink);border-radius:7px;
  padding:6px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a567a;background:#172943}
.btn.pri{border-color:#5a4a2a;color:var(--gold)}
select,input[type=search]{background:#0b1422;border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:6px 9px;font-size:12px;outline:none}
input[type=search]{width:180px}
input[type=search]:focus,select:focus{border-color:#3d6c9c}
.hint{font-size:11px;color:var(--ink3);margin-left:8px}
/* ---------- 主区 ---------- */
main{flex:1 1 auto;display:flex;min-height:0}
#stage{flex:1 1 auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0c1526 0%,#060a12 72%)}
#map,#stars{position:absolute;left:0;top:0;width:100%;height:100%}
#map{z-index:1}
#stars{z-index:2;cursor:crosshair;touch-action:manipulation}
#stageinfo{position:absolute;left:18px;top:16px;z-index:4;pointer-events:none}
#stageinfo .era{font-family:"Songti SC","STSong",serif;font-size:38px;color:var(--gold);
  letter-spacing:.06em;text-shadow:0 0 26px rgba(232,195,122,.28);line-height:1.1}
#stageinfo .sub{font-size:12px;color:var(--ink2);margin-top:5px;letter-spacing:.06em}
#legend{position:absolute;left:18px;bottom:14px;z-index:4;font-size:11px;color:var(--ink3);
  line-height:1.75;pointer-events:none;max-width:430px}
#legend b{color:var(--ink2);font-weight:500}
#tip{position:absolute;z-index:6;pointer-events:none;display:none;background:rgba(9,16,28,.96);
  border:1px solid #34506f;border-radius:7px;padding:8px 11px;font-size:12px;line-height:1.6;
  box-shadow:0 8px 28px rgba(0,0,0,.6);max-width:260px}
#tip .t{color:var(--gold);font-size:13px}
#tip .m{color:var(--ink2)}
#stagebtns{position:absolute;right:12px;top:12px;z-index:5;display:none}
#stagehint{display:none}
/* ---------- 侧栏 ---------- */
aside{flex:0 0 336px;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#stat{padding:12px 15px;border-bottom:1px solid var(--line);flex:0 0 auto}
#stat .big{font-family:"Songti SC",serif;font-size:27px;color:var(--gold);line-height:1.1}
#stat .big span{font-size:12px;color:var(--ink2);font-family:inherit;margin-left:6px}
#stat .row{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
#stat .row b{color:var(--ink);font-weight:600}
#filters{padding:9px 15px;border-bottom:1px solid var(--line);flex:0 0 auto;
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:20px;
  padding:3px 9px;cursor:pointer;background:#0c1524;user-select:none}
.chip.on{color:#0a1018;font-weight:600;border-color:transparent}
.chip.all.on{background:var(--gold)}
#atabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line);background:#0a1320}
#atabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink3);
  padding:9px 4px;font-size:12px;cursor:pointer}
#atabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:#101d30}
.pane{flex:1 1 auto;overflow:auto;min-height:0}
#listwrap{overflow:auto}
#list{padding:5px 0}
.item{padding:8px 15px;border-bottom:1px solid rgba(29,44,66,.55);cursor:pointer;display:flex;
  gap:9px;align-items:flex-start}
.item:hover{background:#142238}
.item.sel{background:#1a2c46;box-shadow:inset 2px 0 0 var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px;box-shadow:0 0 7px currentColor}
.item .nm{font-size:13px;color:var(--ink);line-height:1.35}
.item .meta{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.4}
.item .meta em{font-style:normal;color:var(--ink2)}
.more{text-align:center;padding:11px;color:var(--ink3);font-size:11px}
.empty{padding:24px 16px;color:var(--ink3);font-size:12px;line-height:1.8}
/* ---------- 分析面板 ---------- */
#analysis,#quality{padding:12px 15px 26px}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ahead .ttl{font-size:13px;color:var(--gold);font-weight:600}
.seg.mini button{padding:4px 9px;font-size:11px}
.acard{border:1px solid var(--line);border-radius:9px;background:#0b1524;padding:10px 11px;margin-bottom:11px}
.acard h4{margin:0 0 3px;font-size:12px;color:var(--ink);font-weight:600}
.acard .desc{font-size:10px;color:var(--ink3);line-height:1.6;margin-bottom:8px}
.bar{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11px;cursor:pointer;line-height:1.5}
.bar:hover .bl{color:var(--gold)}
.bar .bl{flex:0 0 92px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{flex:1 1 auto;height:9px;background:#132139;border-radius:5px;overflow:hidden}
.bar .bf{height:100%;border-radius:5px;min-width:2px}
.bar .bn{flex:0 0 52px;text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar.on .bl{color:var(--gold);font-weight:600}
.afoot{font-size:10px;color:var(--ink3);line-height:1.8;margin-top:4px}
#afilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#afilters .chip{font-size:11px}
.kv2{font-size:11px;color:var(--ink2);line-height:1.9}
.kv2 b{color:var(--ink);font-weight:500}
/* ---------- 详情 ---------- */
#detail{display:none;flex:0 0 auto;max-height:44%;overflow:auto;border-top:1px solid #34506f;
  background:#0d1828;padding:13px 15px}
#detail h3{font-family:"Songti SC",serif;font-size:18px;color:var(--gold);margin:0 0 7px;font-weight:600}
#detail .kv{font-size:11px;color:var(--ink2);line-height:1.9}
#detail .kv b{color:var(--ink);font-weight:500}
#detail .bio{font-size:12px;color:var(--ink2);line-height:1.85;margin-top:9px;
  border-top:1px solid var(--line);padding-top:9px}
#detail .close{float:right;cursor:pointer;color:var(--ink3);font-size:19px;line-height:1;padding:2px 6px}
.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;margin:0 4px 3px 0;color:var(--ink3)}
#fullbio{font-size:12px;color:var(--ink2);line-height:1.95;margin-top:10px}
#fullbio p{margin:0 0 9px}
#fullbio .sec{color:var(--gold);font-size:12px;margin:12px 0 5px}
.biobtn{display:inline-block;margin-top:8px;font-size:11px;color:var(--cyan);cursor:pointer;
  border:1px solid #2b4a68;border-radius:5px;padding:4px 9px}
#dmask{display:none}
/* ---------- 时间轴 ---------- */
footer{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(180deg,#080e19,#0b1422);
  padding:9px 20px 12px}
#trackwrap{position:relative;height:38px}
#hist{position:absolute;left:0;top:0;width:100%;height:32px;z-index:1}
#tl{position:absolute;left:0;top:16px;width:100%;z-index:2;margin:0;-webkit-appearance:none;
  appearance:none;background:transparent;height:20px;cursor:pointer}
#tl::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#2b4560,#3a5a80);border-radius:2px}
#tl::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--gold);border:2px solid #2a2212;margin-top:-7px;box-shadow:0 0 12px rgba(232,195,122,.75)}
#tl::-moz-range-track{height:2px;background:#3a5a80}
#tl::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #2a2212}
#ticks{position:relative;height:14px;font-size:10px;color:var(--ink3);margin-top:2px}
#ticks span{position:absolute;transform:translateX(-50%);cursor:pointer;white-space:nowrap}
#ticks span:hover{color:var(--gold)}
#footmeta{font-size:10px;color:var(--ink3);margin-top:5px;line-height:1.6}
/* ---------- 移动端底栏 ---------- */
#mtabs{display:none;flex:0 0 auto;border-top:1px solid var(--line);background:#0a1320;
  padding-bottom:env(safe-area-inset-bottom)}
#mtabs button{flex:1;background:transparent;border:0;border-top:2px solid transparent;color:var(--ink3);
  padding:11px 4px;font-size:12px;cursor:pointer;min-height:46px}
#mtabs button.on{color:var(--gold);border-top-color:var(--gold)}
@media(max-width:1100px){aside{flex-basis:300px}#stageinfo .era{font-size:31px}}
@media(max-width:820px){
  header{padding:7px 10px;gap:6px}
  .brand h1{font-size:16px;letter-spacing:.08em}
  .brand small{display:none}
  .ctrls{width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:2px 0 4px}
  .ctrls::-webkit-scrollbar{height:0}
  .ctrls>*{flex:0 0 auto}
  .ctrls .hint{display:none}
  .seg button,.btn{min-height:34px;padding:5px 10px}
  select,input[type=search]{min-height:34px;font-size:12px}
  input[type=search]{width:130px}
  main{flex-direction:column}
  #stage{flex:0 0 auto;height:40dvh;min-height:210px}
  body.m-map #stage{flex:1 1 auto;height:auto;min-height:0}
  aside{flex:1 1 auto;border-left:0;border-top:1px solid var(--line);min-height:0}
  #legend{display:none}
  #stagehint{display:block;position:absolute;left:10px;right:10px;bottom:12px;z-index:4;
    font-size:11px;color:var(--ink2);background:rgba(8,14,24,.86);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;line-height:1.8}
  #stagehint b{color:var(--gold);font-weight:600}
  #stagehint .go{float:right;color:var(--cyan)}
  body.m-list #stagehint,body.m-ana #stagehint{display:none}
  #stagebtns{display:block}
  #stageinfo{left:10px;top:9px}
  #stageinfo .era{font-size:23px}
  #stageinfo .sub{font-size:10px;max-width:70vw}
  #stat{padding:9px 12px}
  #stat .big{font-size:22px}
  #filters{padding:7px 12px}
  .chip{padding:5px 11px;font-size:12px}
  #atabs button{min-height:40px}
  .item{padding:11px 14px}
  .item .nm{font-size:14px}
  footer{padding:5px 10px 6px}
  #trackwrap{height:34px}
  #hist{height:26px}
  #tl{top:11px;height:28px}
  #tl::-webkit-slider-thumb{width:23px;height:23px;margin-top:-11px}
  #ticks{font-size:9px;height:12px}
  #footmeta{display:none}
  #mtabs{display:flex}
  body.m-map aside{display:none}
  body.m-list #stage,body.m-ana #stage{display:none}
  #detail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:84dvh;z-index:60;
    border:1px solid #34506f;border-radius:16px 16px 0 0;border-bottom:0;
    box-shadow:0 -14px 44px rgba(0,0,0,.72);padding:15px 16px calc(20px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch}
  #dmask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  #listwrap{overscroll-behavior:contain}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>驾鹤集 · 群星纪年</h1><small id="brandsub">1976—2025</small></div>
    <div class="ctrls">
      <div class="seg" id="gran">
        <button data-g="year" class="on">年</button>
        <button data-g="month">月</button>
        <button data-g="day">日</button>
      </div>
      <button class="btn pri" id="play">▶ 播放</button>
      <button class="btn" id="stepb">‹</button>
      <button class="btn" id="stepf">›</button>
      <select id="region"><option value="">全部地区</option></select>
      <input type="search" id="q" placeholder="搜姓名 / 分类…" autocomplete="off">
      <button class="btn" id="onlylocated" title="只看能落到地图上的记录">仅已定位</button>
      <span class="hint" id="speed">空格播放 · ← → 逐年</span>
    </div>
  </header>

  <main>
    <div id="stage">
      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" aria-label="世界陆地示意（无国界）"></svg>
      <canvas id="stars"></canvas>
      <div id="stageinfo"><div class="era" id="era">—</div><div class="sub" id="erasub">—</div></div>
      <div id="legend">
        <b>◈ 星图说明</b><br>
        每颗星是一位逝者，落在其推断地区附近（同地星点做散开处理）；拖动下方时间轴，当期星辰依次亮起。<br>
        <span id="fieldlegend"></span><br>
        底图为<b>无国界陆地剪影</b>，仅作定位参考，不表示任何边界或归属；地区由结构化数据与公开文本推断，非事实结论。页面不加载任何在线地图服务。
      </div>
      <div id="stagebtns"><button class="btn" id="showlegend">◈ 说明</button></div>
      <div id="stagehint"></div>
      <div id="tip"></div>
    </div>

    <aside>
      <div id="stat">
        <div class="big" id="stattotal">—<span>位</span></div>
        <div class="row" id="statrow"></div>
      </div>
      <div id="filters"><span class="chip all on" data-f="">全部领域</span></div>
      <div id="atabs">
        <button data-t="list" class="on">名单</button>
        <button data-t="analysis">分析</button>
        <button data-t="quality">数据说明</button>
      </div>
      <div class="pane" id="listwrap"><div id="list"></div></div>
      <div class="pane" id="analysis" hidden></div>
      <div class="pane" id="quality" hidden></div>
      <div id="detail"></div>
    </aside>
  </main>

  <footer>
    <div id="trackwrap">
      <canvas id="hist"></canvas>
      <input type="range" id="tl" min="0" max="52" value="0" step="1" aria-label="时间轴">
    </div>
    <div id="ticks"></div>
    <div id="footmeta"></div>
  </footer>
  <nav id="mtabs">
    <button data-v="map" class="on">✦ 星图</button>
    <button data-v="list">☰ 名单</button>
    <button data-v="analysis">◫ 分析</button>
  </nav>
</div>
<div id="dmask"></div>

<script src="data/starmap.js"></script>
<script>
(function(){
'use strict';
var D = window.JHSTAR;
if(!D){ document.getElementById('era').textContent='数据未加载'; return; }
/* 列下标，与 build_starmap.py 的 cols 一致 */
var N=0,Y=1,M=2,DD=3,PREC=4,BY=5,AGE=6,REG=7,FLD=8,CAT=9,BIO=10,WIKI=11,
    ID=12,CAUSE=13,CONF=14,RSRC=15,HASBIO=16;
var W=1000,H=500, R=D.rows, RN=D.regions, RP=D.region_points, RC=D.region_cn;
var SPAN=D.span, YEARS=SPAN[1]-SPAN[0]+1;
var CAUSES=D.causes||['未知'], CONFN=D.conf_names||[], RSN=D.rsrc_names||[];
var SHARD=D.shard_size||1000;

/* 领域配色 */
var PALETTE=['#e8c37a','#6fd6d0','#b79ced','#f0a0b4','#f0ae72','#7fb2f0','#96d49a',
             '#d9a6c8','#8fc9e8','#c9d17a','#e39b8a','#9ab6e0','#cdb48c','#86c7b4'];
var FCOLOR={}, FNAMES=D.fields.slice(0,13);
FNAMES.forEach(function(f,i){ FCOLOR[f]=PALETTE[i%PALETTE.length]; });
FCOLOR['分类缺失']='#4d5f78'; FCOLOR['其他']='#8b9bb2';
function colorOf(f){ return FCOLOR[f]||'#8b9bb2'; }

/* ---------- 底图：无国界陆地剪影 + 经纬网 ---------- */
function proj(lon,lat){ return [ (lon+180)/360*W, (90-lat)/180*H ]; }
function drawBase(){
  var s='<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#1a2b42"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs>';
  s+='<rect width="1000" height="500" fill="transparent"/>';
  s+='<g stroke="#16243a" stroke-width="0.6" fill="none">';
  for(var lon=-180;lon<=180;lon+=30){ var x=proj(lon,0)[0]; s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="500"/>'; }
  for(var lat=-60;lat<=90;lat+=30){ var y=proj(0,lat)[1]; s+='<line x1="0" y1="'+y+'" x2="1000" y2="'+y+'"/>'; }
  s+='</g>';
  s+='<path d="'+D.land+'" fill="url(#lg)" stroke="#2b4361" stroke-width="0.65" fill-rule="evenodd"/>';
  document.getElementById('map').innerHTML=s;
}
drawBase();

/* ---------- 领域筛选 chips ---------- */
var filtersEl=document.getElementById('filters');
D.fields.slice(0,13).forEach(function(f){
  var b=document.createElement('span'); b.className='chip'; b.dataset.f=f; b.textContent=f;
  b.style.color=colorOf(f); filtersEl.appendChild(b);
});
filtersEl.onclick=function(e){
  var c=e.target.closest('.chip'); if(!c)return;
  S.field=c.dataset.f||'';
  [].forEach.call(filtersEl.querySelectorAll('.chip'),function(x){
    x.classList.toggle('on',x.dataset.f===S.field);
    if(x.dataset.f===S.field&&S.field){x.style.background=colorOf(S.field);x.style.color='#0a1018';}
    else{x.style.background='';x.style.color=(x.dataset.f?colorOf(x.dataset.f):'');}
  });
  update();
};

/* ---------- 地区下拉 ---------- */
var regSel=document.getElementById('region');
RN.forEach(function(n,i){ var o=document.createElement('option');o.value=String(i);o.textContent=n;regSel.appendChild(o); });

/* ---------- 索引：按年 / 年月 / 年月日 预分桶 ---------- */
var byYear={}, byMonth={}, byDay={}, id2k={};
for(var i=0;i<R.length;i++){
  var r=R[i], y=r[Y], mo=r[M], d=r[DD];
  id2k[r[ID]]=i;
  (byYear[y]||(byYear[y]=[])).push(i);
  if(r[PREC]<=1&&mo) (byMonth[y+'-'+mo]||(byMonth[y+'-'+mo]=[])).push(i);
  if(r[PREC]===0&&mo&&d) (byDay[y+'-'+mo+'-'+d]||(byDay[y+'-'+mo+'-'+d]=[])).push(i);
}
var impreciseYear={};

var cv=document.getElementById('stars'), cx=cv.getContext('2d');

function resize(){

function toPx(lon,lat){ var p=proj(lon,lat); return [VIEW.ox+p[0]*VIEW.s, VIEW.oy+p[1]*VIEW.s]; }
function rnd(seed){ var x=Math.sin(seed*127.1+311.7)*43758.5453; return x-Math.floor(x); }
var BIGREG={'中国':1,'美国':1,'俄罗斯':1,'加拿大':1,'巴西':1,'澳大利亚':1,'印度':1,
  '哈萨克斯坦':1,'蒙古':1,'南非':1,'阿根廷':1,'墨西哥':1,'印尼':1,'沙特':1,'苏丹':1,
  '阿尔及利亚':1,'利比亚':1,'伊朗':1,'刚果（金）':1,'坦桑尼亚':1,'安哥拉':1};
var MIDREG={'日本':1,'英国':1,'法国':1,'德国':1,'意大利':1,'西班牙':1,'韩国':1,'朝鲜':1,
  '波兰':1,'瑞典':1,'挪威':1,'芬兰':1,'乌克兰':1,'土耳其':1,'埃及':1,'泰国':1,'越南':1,
  '马来西亚':1,'菲律宾':1,'新西兰':1,'智利':1,'秘鲁':1,'哥伦比亚':1,'委内瑞拉':1,
  '巴基斯坦':1,'孟加拉国':1,'缅甸':1,'尼日利亚':1,'肯尼亚':1,'埃塞俄比亚':1,'摩洛哥':1,

function capOf(ri){ var n=RN[ri]; return BIGREG[n]?20:(MIDREG[n]?8:4.5); }
function starPos(k,count){
  var r=R[k], ri=r[REG];
  if(ri<0) return null;
  var p=RP[ri], lon=p[0], lat=p[1];
  var rad=Math.min(1.5+Math.sqrt(count)*1.3,capOf(ri));
  var a=rnd(k+7)*Math.PI*2, rr=Math.sqrt(rnd(k+19))*rad;
  var xy=toPx(lon+rr*Math.cos(a), lat+rr*Math.sin(a)*0.62);
  return {x:xy[0],y:xy[1],k:k,c:colorOf(r[FLD]),cn:RC[ri]};
}
function paintHistory(){
  bgx.clearRect(0,0,VIEW.w,VIEW.h);

  for(var k=0;k<R.length;k++){
    var ri=R[k][REG]; if(ri<0)continue;
    var p=starPos(k,900); if(!p)continue;
    bgx.fillRect(p.x,p.y,1.1,1.1);
  }
}
var curStars=[], animStart=0;
function passFilter(r){
  if(S.field&&r[FLD]!==S.field)return false;
  if(S.region!==''&&r[REG]!==Number(S.region))return false;
  if(S.located&&r[REG]<0)return false;
  if(S.cause!==''&&r[CAUSE]!==Number(S.cause))return false;
  if(S.ageBand!==''&&ageBandOf(r[AGE])!==Number(S.ageBand))return false;
  if(S.q){ var s=(r[N]+' '+r[CAT]+' '+r[BIO]).toLowerCase(); if(s.indexOf(S.q)<0)return false; }
  return true;
}
function paint(){
  if(!VIEW.w)return;
  animStart=performance.now();
  var keys=currentKeys();
  var rc={};
  keys.forEach(function(k){var ri=R[k][REG];if(ri>=0)rc[ri]=(rc[ri]||0)+1;});
  curStars=[];
  var vis=[];
  keys.forEach(function(k){
    var r=R[k];
    if(!passFilter(r))return;
    vis.push(k);
    var p=starPos(k,rc[r[REG]]||1); if(p)curStars.push(p);
  });
  S.visible=vis;
  var total=curStars.length, span=Math.min(2400,320+total*1.9);
  curStars.forEach(function(p,i){ p.t=i/Math.max(1,total)*span; });
  drawFrame(animStart);
}
function drawFrame(now){
  if(!VIEW.w)return;
  cx.clearRect(0,0,VIEW.w,VIEW.h);
  cx.drawImage(bg,0,0,VIEW.w,VIEW.h);
  var el=now-animStart, any=false;
  for(var i=0;i<curStars.length;i++){
    var p=curStars[i];
    if(el<p.t){ any=true; continue; }
    var a=Math.min(1,(el-p.t)/520);
    var pulse=0.82+0.18*Math.sin((el-p.t)/760+i*0.7);
    var rad=(0.72+0.85*a)*pulse*(p.k===S.sel?2.3:1);
    cx.globalAlpha=0.11*a;cx.fillStyle=p.c;
    cx.beginPath();cx.arc(p.x,p.y,rad*2.5,0,6.283);cx.fill();
    cx.globalAlpha=0.38*a;
    cx.beginPath();cx.arc(p.x,p.y,rad*1.45,0,6.283);cx.fill();
    cx.globalAlpha=Math.min(1,a*1.15);cx.fillStyle=p.c;
    cx.beginPath();cx.arc(p.x,p.y,rad,0,6.283);cx.fill();
    if(p.k===S.sel){
      cx.globalAlpha=1;cx.strokeStyle='#fff';cx.lineWidth=1;
      cx.beginPath();cx.arc(p.x,p.y,rad+4,0,6.283);cx.stroke();
    }
  }
  cx.globalAlpha=1;
  if(any||el<3400){ S.frame=requestAnimationFrame(drawFrame); }
}

function hitAt(e){
  var b=cv.getBoundingClientRect(), x=e.clientX-b.left, y=e.clientY-b.top;

}

  /* 死因 */
  var cm=countBy(arr,function(r){return r[CAUSE]>0?r[CAUSE]:null;});
  var cItems=Object.keys(cm).map(function(k){return {v:Number(k),label:CAUSES[Number(k)],n:cm[k]};})
    .sort(function(a,b){return b.n-a.n;});
  var cKnown=cItems.reduce(function(a,b){return a+b.n;},0);
  h.push('<div class="acard"><h4>死因归类 · 有记录 '+cKnown.toLocaleString()+' 人</h4>'
    +'<div class="desc">仅 '+(100*cKnown/tot).toFixed(1)+'% 的记录能提取到死因，样本有偏，不可据此推断总体死因结构。点击可反筛。</div>'
    +(cItems.length?barHTML(cItems,Math.max.apply(null,cItems.map(function(x){return x.n;})),'cause','#f0a0b4')
      :'<div class="afoot">当前范围内没有死因记录。</div>')+'</div>');
  /* 享年 */
  var am=countBy(arr,function(r){var b=ageBandOf(r[AGE]);return b>=0?b:null;});
  var aItems=AGE_BANDS.map(function(b,i){return {v:i,label:b[2],n:am[i]||0};});
  var withAge=aItems.reduce(function(a,b){return a+b.n;},0);
  h.push('<div class="acard"><h4>享年分布 · '+withAge.toLocaleString()+' 人有生年</h4>'
    +'<div class="desc">享年按逝世年减出生年粗算，未考虑生日是否已过，误差 ±1 岁。</div>'
    +barHTML(aItems,Math.max.apply(null,aItems.map(function(x){return x.n;})),'age','#7fb2f0')+'</div>');
  h.push('<div class="afoot">全部统计在浏览器本地即时计算，不发任何网络请求；「当期」随时间轴与筛选联动，「全库」为 '+D.n.toLocaleString()+' 人全量。</div>');
  el.innerHTML=h.join('');
}
function renderQuality(){
  var el=document.getElementById('quality');
  var conf={},rs={};
  for(var i=0;i<R.length;i++){var r=R[i];conf[r[CONF]]=(conf[r[CONF]]||0)+1;rs[r[RSRC]]=(rs[r[RSRC]]||0)+1;}
  var cItems=Object.keys(conf).map(function(k){return {v:k,label:CONFN[k]||k,n:conf[k]};}).sort(function(a,b){return b.n-a.n;});
  var rItems=Object.keys(rs).map(function(k){return {v:k,label:RSN[k]||k,n:rs[k]};}).sort(function(a,b){return b.n-a.n;});
  var located=R.filter(function(r){return r[REG]>=0;}).length;
  el.innerHTML='<div class="ahead"><span class="ttl">◈ 数据说明与口径</span></div>'
    +'<div class="acard"><h4>地区定位覆盖率</h4><div class="desc">'
    +'已落位 <b>'+located.toLocaleString()+'</b> / '+D.n.toLocaleString()+' 人（'+(100*located/D.n).toFixed(1)+'%）；'
    +'其中由 Wikidata 结构化字段补齐 <b>'+(D.wd_count||0).toLocaleString()+'</b> 人。'
    +'未定位者不落地图，但完整保留在名单与统计中。</div></div>'
    +'<div class="acard"><h4>定位可信度分布</h4>'+barHTML(cItems,Math.max.apply(null,cItems.map(function(x){return x.n;})),'none','#e8c37a')+'</div>'
    +'<div class="acard"><h4>定位依据分布</h4>'+barHTML(rItems,Math.max.apply(null,rItems.map(function(x){return x.n;})),'none','#b79ced')+'</div>'
    +'<div class="acard"><h4>口径与限制</h4><div class="afoot">'
    +'· 地区是<b>落位参考值</b>，不是国籍或籍贯结论：优先取原库标记与 Wikidata 的 P27 国籍、P19 出生地所属国、P20 逝世地所属国，其次才是维基分类/正文的文本推断。<br>'
    +'· 中国台湾、中国香港、中国澳门使用规范地区表述；底图只有 Natural Earth 110m 陆地海岸线，<b>不绘制任何国界或行政边界</b>。<br>'
    +'· 死因来自正文正则粗分类，覆盖率低，仅作探索；享年为年份差粗算。<br>'
    +'· 完整生平取自本地中文维基正文，共 '+(D.bio_count||0).toLocaleString()+' 人 / '+(D.shards||0)+' 个分片，点击人物时按需载入，首屏不下载。<br>'
    +'· 页面不加载任何在线地图、字体、统计脚本；维基原文链接为唯一可选的外跳。<br>'
    +'· 数据构建 '+esc(D.build)+'；'+esc(D.note)
    +'</div></div>';
}
document.getElementById('analysis').addEventListener('click',function(e){
  var sc=e.target.closest('#ascope button');
  if(sc){A.scope=sc.dataset.s;[].forEach.call(sc.parentNode.children,function(b){b.classList.toggle('on',b===sc);});renderAnalysis();return;}
  var cl=e.target.closest('[data-clear]');
  if(cl){
    var k=cl.dataset.clear;
    if(k==='cause')S.cause=''; else if(k==='age')S.ageBand='';
    else if(k==='field'){S.field='';[].forEach.call(filtersEl.querySelectorAll('.chip'),function(x){
      x.classList.toggle('on',x.dataset.f==='');x.style.background='';x.style.color=(x.dataset.f?colorOf(x.dataset.f):'');});}
    else if(k==='region'){S.region='';regSel.value='';}
    else if(k==='q'){S.q='';document.getElementById('q').value='';}
    else if(k==='located'){S.located=false;var b=document.getElementById('onlylocated');b.classList.remove('pri');b.textContent='仅已定位';}
    update();return;
  }
  var bar=e.target.closest('.bar'); if(!bar||!bar.dataset.k)return;
  var key=bar.dataset.k, v=bar.dataset.v;
  if(key==='field'){S.field=S.field===v?'':v;[].forEach.call(filtersEl.querySelectorAll('.chip'),function(x){
    var on=x.dataset.f===S.field;x.classList.toggle('on',on);
    if(on&&S.field){x.style.background=colorOf(S.field);x.style.color='#0a1018';}
    else{x.style.background='';x.style.color=(x.dataset.f?colorOf(x.dataset.f):'');}});}
  else if(key==='region'){S.region=(S.region!==''&&Number(S.region)===Number(v))?'':String(v);regSel.value=S.region;}
  else if(key==='cause'){S.cause=(S.cause!==''&&Number(S.cause)===Number(v))?'':String(v);}
  else if(key==='age'){S.ageBand=(S.ageBand!==''&&Number(S.ageBand)===Number(v))?'':String(v);}
  else if(key==='decade'){
    var y=Math.max(SPAN[0],Number(v));
    S.gran='year';[].forEach.call(document.getElementById('gran').children,function(x){x.classList.toggle('on',x.dataset.g==='year');});
    S.idx=y-SPAN[0];drawHist();
  } else return;
  update();
  if(key!=='decade')setTab('list');
});

/* ---------- Tab 与移动端视图 ---------- */
function setTab(t){
  A.tab=t;
  [].forEach.call(document.getElementById('atabs').children,function(b){b.classList.toggle('on',b.dataset.t===t);});
  document.getElementById('listwrap').hidden=(t!=='list');
  document.getElementById('analysis').hidden=(t!=='analysis');
  document.getElementById('quality').hidden=(t!=='quality');
  if(t==='analysis')renderAnalysis();
  if(t==='quality')renderQuality();
}
document.getElementById('atabs').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  setTab(b.dataset.t);
  if(MOBILE&&b.dataset.t==='quality')setMView('list');
};
function setMView(v){
  document.body.className=v==='map'?'m-map':(v==='analysis'?'m-list m-ana':'m-list');
  [].forEach.call(document.getElementById('mtabs').children,function(b){b.classList.toggle('on',b.dataset.v===v);});
  setTab(v==='analysis'?'analysis':'list');
  setTimeout(function(){resize();drawHist();},40);
}
document.getElementById('mtabs').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;setMView(b.dataset.v);
};
if(MOBILE)document.body.className='m-map';
if(MQ.addEventListener)MQ.addEventListener('change',function(e){
  MOBILE=e.matches;
  if(!MOBILE){document.body.className='';document.getElementById('dmask').classList.remove('show');}
  else if(!document.body.className)document.body.className='m-map';
  setTimeout(function(){resize();drawHist();},60);
});
document.getElementById('showlegend').onclick=function(){
  var l=document.getElementById('legend');
  l.style.display=(l.style.display==='block')?'none':'block';
  l.style.background='rgba(6,10,18,.9)';l.style.padding='9px';l.style.borderRadius='8px';
  l.style.maxHeight='60%';l.style.overflow='auto';l.style.pointerEvents='auto';
};

/* ---------- 统计 ---------- */
function renderStat(){
  var t=stepDate(S.idx), keys=currentKeys(), vis=S.visible||[];
  document.getElementById('era').textContent=t.label;
  var impre=S.gran==='year'?0:impreciseYear[t.y]||0;
  document.getElementById('erasub').textContent=t.sub+' · 收录 '+keys.length+' 人'
    +(impre?'　（另有 '+impre+' 人原始日期仅精确到年，需在「年」档查看）':'');
  var located=vis.filter(function(k){return R[k][REG]>=0;}).length;
  var ages=vis.map(function(k){return R[k][AGE];}).filter(function(a){return a>0;});
  var avg=ages.length?(ages.reduce(function(a,b){return a+b;},0)/ages.length).toFixed(1):'—';
  var fc={};vis.forEach(function(k){var f=R[k][FLD];fc[f]=(fc[f]||0)+1;});
  var top=Object.keys(fc).sort(function(a,b){return fc[b]-fc[a];}).slice(0,3)
    .map(function(f){return f+' '+fc[f];}).join(' · ');
  document.getElementById('stattotal').innerHTML=vis.length+'<span>位 · 当期显示</span>';
  document.getElementById('statrow').innerHTML=
    '<span>已落图 <b>'+located+'</b></span><span>平均享年 <b>'+avg+'</b></span>'
    +'<span>领域 <b>'+esc(top||'—')+'</b></span>';
  var sh=document.getElementById('stagehint');
  if(sh){
    sh.innerHTML='当期 <b>'+vis.length+'</b> 位 · 已落图 '+located+' · 平均享年 <b>'+avg+'</b>'
      +'<span class="go">☰ 名单 / 分析 →</span>';
    sh.onclick=function(){if(MOBILE)setMView('list');};
  }
  var link='?t='+t.y+(t.m?'-'+t.m:'')+(t.d?'-'+t.d:'')+'&g='+S.gran;
  document.getElementById('footmeta').innerHTML=
    '共收录 <b>'+D.n.toLocaleString()+'</b> 位（'+D.span[0]+'—'+D.span[1]+'）　·　数据构建 '+esc(D.build)
    +'　·　'+esc(D.note)+'　·　本视图深链 <code>'+esc(link)+'</code>';
}

/* ---------- 时间轴刻度 / 直方图 ---------- */
function drawHist(){
  var c=document.getElementById('hist'), g=c.getContext('2d');
  var w=c.clientWidth,h=c.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(!w)return;
  c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  var steps=granSteps(), max=1, vals=[];
  for(var i=0;i<steps;i++){
    var t=stepDate(i), n=0;
    if(S.gran==='year')n=(byYear[t.y]||[]).length;
    else if(S.gran==='month')n=(byMonth[t.y+'-'+t.m]||[]).length;
    else n=(byDay[t.y+'-'+t.m+'-'+t.d]||[]).length;
    vals.push(n);if(n>max)max=n;
  }
  g.fillStyle='rgba(111,214,208,.30)';
  var base=h-2, top=h-6;
  for(var j=0;j<steps;j++){
    var bh=Math.max(1,vals[j]/max*top), x=j/Math.max(1,steps-1)*w;
    g.fillRect(x,base-bh,Math.max(1,w/steps),bh);
  }
  var ticks=document.getElementById('ticks'), out=[];
  var marks=S.gran==='year'?[1980,1990,2000,2010,2020,2025]
            :S.gran==='month'?[1980,1990,2000,2010,2020,2025]
            :[1980,1990,2000,2010,2020,2025];
  marks.forEach(function(y){
    if(y<SPAN[0]||y>SPAN[1])return;
    var pos=S.gran==='year'?(y-SPAN[0])/(YEARS-1)
           :S.gran==='month'?((y-SPAN[0])*12)/(YEARS*12-1)
           :((y-SPAN[0])*365.25)/(daysTotal()-1);
    out.push('<span data-y="'+y+'" style="left:'+(pos*100).toFixed(2)+'%">'+y+'</span>');
  });
  ticks.innerHTML=out.join('');
  [].forEach.call(ticks.children,function(sp){
    sp.onclick=function(){
      var y=Number(sp.dataset.y);
      S.idx=S.gran==='year'?y-SPAN[0]:S.gran==='month'?(y-SPAN[0])*12
            :Math.round((Date.UTC(y,0,1)-DAY0)/86400000);
      S.idx=Math.max(0,Math.min(granSteps()-1,S.idx));
      syncSlider();update();
    };
  });
}
function syncSlider(){
  var el=document.getElementById('tl');
  el.max=String(granSteps()-1);el.value=String(S.idx);
}

/* ---------- 更新主流程 ---------- */
function update(){
  syncSlider();
  curStars=[];
  paint();
  S.shown=80;
  renderStat();
  renderList();
  listWrap.scrollTop=0;
  if(A.tab==='analysis')renderAnalysis();
  try{
    history.replaceState(null,'','?t='+encodeURIComponent((function(){
      var t=stepDate(S.idx);return t.y+(t.m?'-'+t.m:'')+(t.d?'-'+t.d:'');
    })())+'&g='+S.gran+(A.tab==='analysis'?'&p=analysis':''));
  }catch(err){}
}

/* ---------- 交互绑定 ---------- */
document.getElementById('gran').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  var old=stepDate(S.idx);
  S.gran=b.dataset.g;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
  S.idx=S.gran==='year'?old.y-SPAN[0]
       :S.gran==='month'?(old.y-SPAN[0])*12+(old.m?old.m-1:0)
       :Math.round((Date.UTC(old.y,(old.m||1)-1,old.d||1)-DAY0)/86400000);
  S.idx=Math.max(0,Math.min(granSteps()-1,S.idx));
  drawHist();update();
};
document.getElementById('tl').oninput=function(){S.idx=Number(this.value);update();};
regSel.onchange=function(){S.region=this.value;update();};
document.getElementById('q').oninput=function(){S.q=this.value.trim().toLowerCase();update();};
document.getElementById('onlylocated').onclick=function(){
  S.located=!S.located;this.classList.toggle('pri');
  this.textContent=S.located?'✓ 仅已定位':'仅已定位';update();
};
function step(n){
  S.idx=Math.max(0,Math.min(granSteps()-1,S.idx+n));
  if(S.idx===0&&n<0)stop();
  update();
}
document.getElementById('stepb').onclick=function(){step(-1);};
document.getElementById('stepf').onclick=function(){step(1);};
function play(){
  S.playing=true;document.getElementById('play').textContent='❚❚ 暂停';
  var ms=S.gran==='year'?1000:S.gran==='month'?340:170;
  timer=setInterval(function(){
    if(S.idx>=granSteps()-1){stop();return;}
    S.idx++;update();
  },ms);
}
function stop(){S.playing=false;clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 播放';}
document.getElementById('play').onclick=function(){S.playing?stop():play();};
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();S.playing?stop():play();}
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  if(e.key==='/'){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape')closeDetail();
});
window.addEventListener('resize',function(){MOBILE=MQ.matches;resize();drawHist();});
window.addEventListener('orientationchange',function(){setTimeout(function(){resize();drawHist();},250);});

/* ---------- 深链恢复 ---------- */
(function(){
  var p=new URLSearchParams(location.search), g=p.get('g'), t=p.get('t');
  if(g&&['year','month','day'].indexOf(g)>=0){
    S.gran=g;
    [].forEach.call(document.getElementById('gran').children,function(x){
      x.classList.toggle('on',x.dataset.g===g);
    });
  }
  if(t){
    var m=String(t).match(/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/);
    if(m){
      var y=Number(m[1]),mo=Number(m[2]||0),d=Number(m[3]||0);
      S.idx=S.gran==='year'?y-SPAN[0]
           :S.gran==='month'?(y-SPAN[0])*12+(mo?mo-1:0)
           :Math.round((Date.UTC(y,(mo||1)-1,d||1)-DAY0)/86400000);
    }
  }else{ S.idx=granSteps()-1; }
  S.idx=Math.max(0,Math.min(granSteps()-1,S.idx));
  if(p.get('p')==='analysis'){A.tab='analysis';if(MOBILE)setMView('analysis');}
  var pid=Number(p.get('id')||0);
  if(pid&&id2k[pid]!=null)window.__STAR_OPEN=pid;
})();

/* ---------- 启动 ---------- */
document.getElementById('brandsub').textContent=D.span[0]+'—'+D.span[1]+' · '+D.n.toLocaleString()+' 人';
document.getElementById('fieldlegend').innerHTML=D.fields.slice(0,8).map(function(f){
  return '<span style="color:'+colorOf(f)+'">●</span> '+esc(f);
}).join('　');
setTab(A.tab);
resize();drawHist();update();
if(window.__STAR_OPEN&&id2k[window.__STAR_OPEN]!=null)openDetail(id2k[window.__STAR_OPEN]);

/* 只读调试接口：便于自动化验证与日后排障 */
window.__STAR={
  data:D,
  get state(){return S;},
  get stars(){return curStars.length;},
  get visible(){return (S.visible||[]).length;},
  get date(){return stepDate(S.idx);},
  get steps(){return granSteps();},
  get tab(){return A.tab;},
  get mobile(){return MOBILE;},
  update:update,
  setTab:setTab,
  setMView:setMView,
  analysis:renderAnalysis,
  quality:renderQuality,
  loadBio:loadBio,
  openById:function(id){if(id2k[id]!=null)openDetail(id2k[id]);return id2k[id];},
  jump:function(y,m,d,g){
    if(g&&['year','month','day'].indexOf(g)>=0){
      S.gran=g;
      [].forEach.call(document.getElementById('gran').children,function(x){x.classList.toggle('on',x.dataset.g===g);});
    }
    S.idx=S.gran==='year'?y-SPAN[0]
         :S.gran==='month'?(y-SPAN[0])*12+((m||1)-1)
         :Math.round((Date.UTC(y,(m||1)-1,d||1)-DAY0)/86400000);
    S.idx=Math.max(0,Math.min(granSteps()-1,S.idx));
    drawHist();update();
    return stepDate(S.idx);
  }
};
})();
</script>
